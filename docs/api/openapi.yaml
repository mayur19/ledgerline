              type: object
  /entities:
    get:
      tags:
        - Entities
      operationId: listEntities
      summary: List legal entities
      x-status: implemented
      description: Requires permission `entity.view`.
      responses:
        '200':
          description: Entities
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Entity'
                  error:
                    type: 'null'
                  meta:
