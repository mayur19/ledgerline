openapi: 3.1.0
info:
  title: Ledgerline API
  version: 0.1.0
  description:
    Multi-entity double-entry accounting and financial close. Every operation carries `x-status` (`implemented`
    or `pending`); pending operations carry `x-ticket` and currently answer 501. All responses use the envelope
    `{ data, error, meta }`. Money is decimal strings in the line currency; never JSON numbers.
  license:
    name: MIT
servers:
  - url: http://127.0.0.1:4101/api/v1
    description: Local development
  - url: /api/v1
    description: Behind nginx
tags:
  - name: Health
  - name: Auth
  - name: Audit
  - name: Entities
  - name: Accounts
  - name: Periods
  - name: FX
  - name: Journals
  - name: Reports
  - name: Users & access
  - name: Close
  - name: Consolidation
  - name: Reconciliation
  - name: Approvals
  - name: Platform
paths:
  /api-tokens:
    get:
      tags:
        - Platform
      operationId: pendingGetApiTokens
      summary: List read API tokens
      x-status: pending
      x-ticket: LL-110
      description: Planned (LL-110). Currently answers `501 NOT_IMPLEMENTED` with `details.ticket = "LL-110"`.
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      security: &id001
        - sessionCookie: []
    post:
      tags:
        - Platform
      operationId: pendingPostApiTokens
      summary: Create a read API token
      x-status: pending
      x-ticket: LL-110
      description: Planned (LL-110). Currently answers `501 NOT_IMPLEMENTED` with `details.ticket = "LL-110"`.
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      security: &id002
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
  /approval-policies:
    get:
      tags:
        - Approvals
      operationId: pendingGetApprovalPolicies
      summary: List approval policies
      x-status: pending
      x-ticket: LL-080
      description: Planned (LL-080). Currently answers `501 NOT_IMPLEMENTED` with `details.ticket = "LL-080"`.
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      security: *id001
    post:
      tags:
        - Approvals
      operationId: pendingPostApprovalPolicies
      summary: Create an approval policy
      x-status: pending
      x-ticket: LL-080
      description: Planned (LL-080). Currently answers `501 NOT_IMPLEMENTED` with `details.ticket = "LL-080"`.
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      security: *id002
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
  /approvals/inbox:
    get:
      tags:
        - Approvals
      operationId: pendingGetApprovalsInbox
      summary: My pending approvals
      x-status: pending
      x-ticket: LL-081
      description: Planned (LL-081). Currently answers `501 NOT_IMPLEMENTED` with `details.ticket = "LL-081"`.
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      security: *id001
  /audit-events:
    get:
      tags:
        - Audit
      operationId: listAuditEvents
      summary: Audit trail (newest first)
      x-status: implemented
      description: Requires permission `audit.view`.
      parameters:
        - &id005
          name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - &id006
          name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: targetType
          in: query
          required: false
          schema:
            type: string
        - name: targetId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  error:
                    type: 'null'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
      security: *id001
  /audit-events/verify:
    get:
      tags:
        - Users & access
      operationId: pendingGetAuditEventsVerify
      summary: Verify audit hash chain
      x-status: pending
      x-ticket: LL-019
      description: Planned (LL-019). Currently answers `501 NOT_IMPLEMENTED` with `details.ticket = "LL-019"`.
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      security: *id001
  /auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Sign in
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in. Sets `ll_session` (HttpOnly) and `ll_csrf` cookies.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResponse'
                  error:
                    type: 'null'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
      security: []
      description:
        Throttled by normalised IP (fixed window), distinct emails per IP, and per-email progressive
        backoff.
  /auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Sign out and revoke the session
      x-status: implemented
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: object
                    properties:
                      loggedOut:
                        type: boolean
                  error:
                    type: 'null'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
      security: *id002
  /auth/me:
    get:
      tags:
        - Auth
      operationId: getMe
      summary: Current user, organization, role and permissions
      x-status: implemented
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/Profile'
                  error:
                    type: 'null'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      security: *id001
  /auth/mfa/totp:
    post:
      tags:
        - Users & access
      operationId: pendingPostAuthMfaTotp
      summary: Enrol a TOTP authenticator
      x-status: pending
      x-ticket: LL-018
      description: Planned (LL-018). Currently answers `501 NOT_IMPLEMENTED` with `details.ticket = "LL-018"`.
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      security: *id002
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
  /auth/password-reset:
    post:
      tags:
        - Users & access
      operationId: pendingPostAuthPasswordReset
      summary: Request a password reset
      x-status: pending
      x-ticket: LL-015
      description: Planned (LL-015). Currently answers `501 NOT_IMPLEMENTED` with `details.ticket = "LL-015"`.
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      security: *id002
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
  /auth/register:
    post:
      tags:
        - Auth
      operationId: register
      summary: Register an organization and its owner
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Accepted; identical response whether or not the email exists. No session is started.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                  error:
                    type: 'null'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
      security: []
      description:
        Never reveals whether the email is already registered. Rate-limited per normalised client IP.
        Email verification is planned (LL-120).
  /auth/register/verify:
    post:
      tags:
        - Users & access
      operationId: pendingPostAuthRegisterVerify
      summary: Confirm sign-up via emailed token
      x-status: pending
      x-ticket: LL-120
      description: Planned (LL-120). Currently answers `501 NOT_IMPLEMENTED` with `details.ticket = "LL-120"`.
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      security: *id002
      requestBody:
        required: false
        content:
          application/json:
            schema:
