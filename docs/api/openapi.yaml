  /entities/{entityId}/access:
    put:
      tags:
        - Users & access
      operationId: pendingPutEntitiesEntityidAccess
      summary: Assign users to an entity
      x-status: pending
      x-ticket: LL-017
      description: Planned (LL-017). Currently answers `501 NOT_IMPLEMENTED` with `details.ticket = "LL-017"`.
      responses:
