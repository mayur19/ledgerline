  /entities/{entityId}:
    get:
      tags:
        - Entities
      operationId: getEntity
      summary: Get an entity
      x-status: implemented
      description: Requires permission `entity.view`.
      parameters:
        - &id003
          name: entityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Entity
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/Entity'
                  error:
                    type: 'null'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
