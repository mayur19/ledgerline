components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ll_session
      description: HttpOnly session cookie set by /auth/login.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Must equal the ll_csrf cookie on POST/PUT/PATCH/DELETE.
  schemas:
    CurrencyCode:
      type: string
      enum:
        - USD
        - EUR
        - GBP
        - CHF
        - CAD
        - AUD
        - SGD
        - INR
        - MXN
        - JPY
        - KRW
        - KWD
        - BHD
    Money: &id008
      type: string
      pattern: ^-?\d+(\.\d+)?$
      examples:
        - '1250.00'
    Meta:
      type: object
      properties:
        requestId:
          type: string
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details: {}
    ErrorEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/Meta'
    PostingError:
      type: object
      properties:
        code:
          type: string
          enum:
            - TOO_FEW_LINES
            - INVALID_AMOUNT
            - NON_POSITIVE_AMOUNT
            - EXCESS_PRECISION
            - UNKNOWN_CURRENCY
            - ACCOUNT_NOT_FOUND
            - ACCOUNT_INACTIVE
            - ACCOUNT_NOT_POSTABLE
            - ACCOUNT_CURRENCY_MISMATCH
            - RATE_INVALID
            - RATE_MISSING
            - RATE_CONFLICT
            - FUNCTIONAL_RATE_NOT_ONE
            - ROUNDING_ACCOUNT_REQUIRED
            - UNBALANCED
        message:
          type: string
        line:
          type: integer
        details:
          type: object
          additionalProperties:
            type: string
    Health:
      type: object
      properties:
        status:
          const: ok
        version:
          type: string
        uptimeSeconds:
          type: integer
    Ready:
      type: object
      properties:
        status:
          const: ready
        checks:
          type: object
    Role:
      type: string
      enum:
        - owner
        - admin
        - controller
        - accountant
        - approver
        - auditor
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - organizationName
        - displayName
        - email
        - password
      properties:
        organizationName:
          type: string
          minLength: 2
          maxLength: 120
        displayName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 200
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    Profile:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            displayName:
              type: string
        organization:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: string
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/Profile'
        - type: object
          properties:
            csrfToken:
              type: string
              description: Same value as the ll_csrf cookie; send as X-CSRF-Token.
    AuditEvent:
      type: object
      properties:
        id:
          type: string
        action:
          type: string
          examples:
            - journal.posted
        targetType:
          type: string
        targetId:
          type:
            - string
            - 'null'
        entityId:
          type:
            - string
            - 'null'
        metadata:
          type: object
        actor:
          type:
            - object
            - 'null'
        requestId:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
    Entity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
        code:
          type: string
        name:
          type: string
        functionalCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        countryCode:
          type:
            - string
            - 'null'
        timezone:
          type: string
          examples:
            - Europe/Berlin
        roundingAccountId:
          type:
            - string
            - 'null'
        retainedEarningsAccountId:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
    CreateEntityRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - functionalCurrency
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9-]{1,15}$
        name:
          type: string
        functionalCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
        timezone:
          type: string
          default: UTC
          description: Supported IANA zone; stored canonicalised.
        chartTemplate:
          type: string
          enum:
            - standard
            - empty
          default: standard
    EntitySettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        roundingAccountId:
          type:
            - string
            - 'null'
          format: uuid
        retainedEarningsAccountId:
          type:
            - string
            - 'null'
          format: uuid
    AccountType:
      type: string
      enum:
        - asset
        - liability
        - equity
        - revenue
        - expense
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        type:
          $ref: '#/components/schemas/AccountType'
        parentId:
          type:
            - string
            - 'null'
        isPostable:
          type: boolean
        isActive:
          type: boolean
        currency:
          type:
            - string
            - 'null'
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - type
      properties:
        code:
          type: string
          pattern: ^\d{3,12}(?:-\d{1,6}){0,3}$
        name:
          type: string
        type:
          $ref: '#/components/schemas/AccountType'
        parentId:
          type:
            - string
            - 'null'
          format: uuid
        isPostable:
          type: boolean
          default: true
        currency:
          oneOf:
            - $ref: '#/components/schemas/CurrencyCode'
            - type: 'null'
        description:
          type: string
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
        isActive:
          type: boolean
        parentId:
          type:
            - string
            - 'null'
          format: uuid
        description:
          type: string
    Period:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entityId:
          type: string
        fiscalYear:
          type: integer
        periodNumber:
          type: integer
        name:
          type: string
          examples:
            - FY2026-P01
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          type: string
          enum:
            - open
            - soft_closed
            - closed
        statusChangedAt:
          type: string
          format: date-time
    CreateFiscalYearRequest:
      type: object
      additionalProperties: false
      required:
        - startMonth
      properties:
        startMonth:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
        periods:
          type: integer
          minimum: 1
          maximum: 13
          default: 12
    PeriodTransitionRequest:
      type: object
      additionalProperties: false
      required:
        - to
      properties:
        to:
          type: string
          enum:
            - open
            - soft_closed
            - closed
        reason:
          type: string
          maxLength: 500
    FxRate:
      type: object
      properties:
        id:
          type: string
        fromCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        toCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        rateType:
          type: string
          enum:
            - spot
            - average
            - closing
        rateDate:
          type: string
          format: date
        rate:
          type: string
          examples:
            - '1.0845'
        createdAt:
          type: string
          format: date-time
    CreateFxRateRequest:
      type: object
      additionalProperties: false
      required:
        - fromCurrency
        - toCurrency
        - rateDate
        - rate
      properties:
        fromCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        toCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        rateDate:
          type: string
          format: date
        rate:
          type: string
          pattern: ^\d{1,9}(\.\d{1,10})?$
        rateType:
          type: string
          enum:
            - spot
            - average
            - closing
          default: spot
    JournalLineInput:
      type: object
      additionalProperties: false
      required:
        - accountId
        - side
        - amount
        - currency
      properties:
        accountId:
          type: string
          format: uuid
        side:
          type: string
          enum:
            - debit
            - credit
        amount: *id008
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        rate:
          type: string
          description: Optional explicit rate (functional units per unit of currency).
        memo:
          type: string
          maxLength: 240
    JournalInput:
      type: object
      additionalProperties: false
      required:
        - entryDate
        - memo
        - lines
      properties:
        entryDate:
          type: string
          format: date
        memo:
          type: string
          maxLength: 500
        reference:
          type: string
          maxLength: 64
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/JournalLineInput'
    CreateJournalRequest:
      allOf:
        - $ref: '#/components/schemas/JournalInput'
        - type: object
          properties:
            post:
              type: boolean
              default: false
    JournalSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entryNumber:
          type:
            - string
            - 'null'
          examples:
            - NW-US-2026-000007
        status:
          type: string
          enum:
            - draft
            - posted
            - reversed
        source:
          type: string
        entryDate:
          type: string
          format: date
        fiscalYear:
          type: integer
        periodId:
          type: string
        memo:
          type: string
        reference:
          type:
            - string
            - 'null'
        functionalCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        totalDebit: *id008
        totalCredit: *id008
        createdBy:
          type:
            - object
            - 'null'
        createdAt:
          type: string
          format: date-time
        postedBy:
          type:
            - object
            - 'null'
        postedAt:
          type:
            - string
            - 'null'
          format: date-time
    JournalLine:
      type: object
      properties:
        lineNumber:
          type: integer
        accountId:
          type: string
        accountCode:
          type: string
        accountName:
          type: string
        side:
          type: string
          enum:
            - debit
            - credit
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        amount: *id008
        amountMinor:
          type: string
        rate:
          type: string
        functionalAmount: *id008
        functionalMinor:
          type: string
        memo:
          type:
            - string
            - 'null'
        isRoundingAdjustment:
          type: boolean
    JournalEntry:
      allOf:
        - $ref: '#/components/schemas/JournalSummary'
        - type: object
          properties:
            lines:
              type: array
              items:
                $ref: '#/components/schemas/JournalLine'
    JournalPreview:
      type: object
      properties:
        period:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            status:
              type: string
        functionalCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        totalDebit: *id008
        totalCredit: *id008
        roundingAdjustment: *id008
        lines:
          type: array
          items:
            type: object
    TrialBalanceRow:
      type: object
      properties:
        accountId:
          type: string
        code:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/AccountType'
        depth:
          type: integer
        isHeader:
          type: boolean
        opening: *id008
        periodDebit: *id008
        periodCredit: *id008
        closing: *id008
        closingDebit: *id008
        closingCredit: *id008
    TrialBalance:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        fiscalYear:
          type: integer
        fiscalYearStart:
          type: string
          format: date
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        isBalanced:
          type: boolean
        priorYearEarnings: *id008
        rows:
          type: array
          items:
            $ref: '#/components/schemas/TrialBalanceRow'
        totals:
          type: object
          properties:
            openingDebit: *id008
            openingCredit: *id008
            periodDebit: *id008
            periodCredit: *id008
            closingDebit: *id008
            closingCredit: *id008
  responses:
    BadRequest:
      description: Validation failed (`VALIDATION_ERROR`, `BAD_REQUEST`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - path: email
                  message: Invalid email
            meta:
              requestId: 7f0c…
    Unauthenticated:
      description: No valid session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: UNAUTHENTICATED
              message: Authentication required
            meta:
              requestId: 7f0c…
    InvalidCredentials:
      description: Wrong email or password
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: INVALID_CREDENTIALS
              message: Email or password is incorrect
            meta:
              requestId: 7f0c…
    Forbidden:
      description: Missing permission, CSRF failure or soft-closed period
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: FORBIDDEN
              message: You do not have permission to perform this action
            meta:
              requestId: 7f0c…
    NotFound:
      description: Not found or belongs to another organization
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: NOT_FOUND
              message: Entity not found
            meta:
              requestId: 7f0c…
    Conflict:
      description: State conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: PERIOD_CLOSED
              message: Period FY2025-P12 is closed
            meta:
              requestId: 7f0c…
    Unprocessable:
      description: Domain validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: JOURNAL_INVALID
              message: The journal entry is not valid
              details:
                errors:
                  - code: UNBALANCED
                    message: Debits 100.00 and credits 99.99 differ by 0.01 USD
            meta:
              requestId: 7f0c…
    RateLimited:
      description: Throttled; see Retry-After
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: RATE_LIMITED
              message: Too many attempts, try again later
              details:
                retryAfterSeconds: 30
            meta:
              requestId: 7f0c…
    Unavailable:
      description: Dependency unavailable or retryable conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: NOT_READY
              message: Database unavailable
            meta:
              requestId: 7f0c…
    NotImplemented:
      description: Planned endpoint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: NOT_IMPLEMENTED
              message: Run period-end revaluation is planned but not implemented yet
              details:
                ticket: LL-052
            meta:
              requestId: 7f0c…
